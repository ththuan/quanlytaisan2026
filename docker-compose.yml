services:
  # Database
  postgres:
    image: postgres:14-alpine
    container_name: asset-management-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-asset_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asset-management-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./asset-management-backend
      dockerfile: Dockerfile
      target: development
    container_name: asset-management-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-asset_management}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-Ctec@123}
      BODY_LIMIT: ${BODY_LIMIT:-10mb}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_IDLE: ${DB_POOL_IDLE:-30000}
      DB_POOL_ACQUIRE: ${DB_POOL_ACQUIRE:-30000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asset-management-network
    volumes:
      - ./asset-management-backend/src:/app/src
      - ./asset-management-backend/tsconfig.json:/app/tsconfig.json
      - ./asset-management-backend/logs:/app/logs
      - ./asset-management-backend/storage:/app/storage
      - backend_backups:/app/backups
      - /app/node_modules
      # Cho phép trang Quản trị hệ thống gọi lệnh docker (xem/start/stop container)
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "npm install --production=false && (npm run migrate || echo 'MIGRATE FAILED') && (npm run seed:admin || true) && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

  # Frontend Web
  frontend:
    build:
      context: ./asset-management-frontend
      dockerfile: Dockerfile
      target: development
    container_name: asset-management-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - asset-management-network
    volumes:
      - ./asset-management-frontend/src:/app/src
      - ./asset-management-frontend/public:/app/public
      - ./asset-management-frontend/package.json:/app/package.json
      - /app/node_modules

  # Cloudflare Quick Tunnel - miễn phí, chạy ngay, không cần tài khoản
  # Nginx reverse proxy - HTTPS trên cổng 443, HTTP redirect trên cổng 80
  nginx:
    image: nginx:alpine
    container_name: asset-management-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - asset-management-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: asset-management-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:3000
    depends_on:
      - frontend
    networks:
      - asset-management-network
    profiles:
      - cloudflare

networks:
  asset-management-network:
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: quanlytaisan_postgres_data
  backend_backups:
