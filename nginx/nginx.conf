worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 20m;
    server_tokens off;

    # Lấy IP thật khi đi qua Cloudflare Tunnel (cloudflared nằm trong Docker network).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_recursive on;
    # Giữ đủ header để backend rate limit / log đúng IP người dùng.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/x-font-ttf font/opentype;
    gzip_min_length 1000;

    # Upstream keepalive pools - tái sử dụng TCP connections
    upstream backend_pool {
        server backend:5000;
        keepalive 64;
    }

    upstream frontend_pool {
        server frontend:80;
        keepalive 32;
    }

    # HTTP server - cho phép public scan page và API public không cần HTTPS
    # (tránh lỗi SSL self-signed cert trên điện thoại khi quét QR)
    server {
        listen 80;
        server_name _;

        # Trang tra cứu QR - backend phục vụ HTML trực tiếp (không cần Vue SPA, không cần auth)
        location /scan/ {
            proxy_pass         http://backend_pool/scan/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
        }

        # API public (tra cứu qua QR) - cho phép HTTP không redirect HTTPS
        location /api/public/ {
            proxy_pass         http://backend_pool/api/public/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # API Backend (đăng nhập, CRUD...) - phải có trên cả HTTP để login qua http://IP hoạt động
        location /api/ {
            proxy_pass         http://backend_pool/api/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            add_header         Cache-Control "private, no-store, max-age=0" always;
            add_header         Pragma "no-cache" always;
            add_header         Vary "Authorization" always;
        }

        # Storage (ảnh tài sản)
        location /storage/ {
            proxy_pass         http://backend_pool/storage/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
        }

        # Icon/logo tĩnh ở thư mục gốc → cache 30 ngày
        location ~* ^/(?:logo-truong|icon-|apple-touch-icon|favicon).*\.(?:ico|png|jpe?g|svg|webp)$ {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=2592000";
            add_header         X-Content-Type-Options "nosniff" always;
            access_log         off;
        }

        # Tất cả các đường dẫn khác → serve frontend (HTTP)
        location / {
            proxy_pass         http://frontend_pool/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
            add_header         X-Frame-Options "DENY" always;
            add_header         X-Content-Type-Options "nosniff" always;
            add_header         Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header         Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header         Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Trang tra cứu QR - backend phục vụ HTML trực tiếp (không cần Vue SPA, không cần auth)
        location /scan/ {
            proxy_pass         http://backend_pool/scan/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
        }

        # API Backend
        location /api/ {
            proxy_pass         http://backend_pool/api/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            add_header         Cache-Control "private, no-store, max-age=0" always;
            add_header         Pragma "no-cache" always;
            add_header         Vary "Authorization" always;
        }

        # Static storage (images upload)
        location /storage/ {
            proxy_pass         http://backend_pool/storage/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
        }

        # Service Worker và Manifest - không cache, header đặc biệt
        location = /sw.js {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
            add_header         Service-Worker-Allowed "/";
            expires            -1;
        }

        location = /manifest.webmanifest {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
            expires            -1;
        }

        # Icon/logo tĩnh ở thư mục gốc → cache 30 ngày
        location ~* ^/(?:logo-truong|icon-|apple-touch-icon|favicon).*\.(?:ico|png|jpe?g|svg|webp)$ {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=2592000";
            add_header         X-Content-Type-Options "nosniff" always;
            access_log         off;
        }

        # Frontend - static assets có hash → cache vĩnh viễn
        # Dùng ^ để anchor đầu URI, tránh khớp nhầm /storage/assets/...
        location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=31536000, immutable";
            access_log         off;
        }

        # Frontend - index.html và các file không có hash → không cache
        location / {
            proxy_pass         http://frontend_pool/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
            add_header         X-Frame-Options "DENY" always;
            add_header         X-Content-Type-Options "nosniff" always;
            add_header         Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header         Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header         Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        }
    }
}
