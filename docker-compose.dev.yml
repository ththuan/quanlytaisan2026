version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: asset-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-asset_management}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asset-management-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./asset-management-backend
      dockerfile: Dockerfile
      target: development
    container_name: asset-management-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-asset_management}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asset-management-network
    volumes:
      - ./asset-management-backend/src:/app/src
      - ./asset-management-backend/logs:/app/logs
      - ./asset-management-backend/storage:/app/storage
      - /app/node_modules
    command: sh -c "npm run migrate && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./asset-management-frontend
      dockerfile: Dockerfile
      target: development
    container_name: asset-management-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - asset-management-network
    volumes:
      - ./asset-management-frontend/src:/app/src
      - ./asset-management-frontend/index.html:/app/index.html
      - ./asset-management-frontend/vite.config.ts:/app/vite.config.ts
      - ./asset-management-frontend/tsconfig.json:/app/tsconfig.json
      - ./asset-management-frontend/package.json:/app/package.json
      - /app/node_modules

volumes:
  postgres_data:
    external: true
    name: quanlytaisan_postgres_data

networks:
  asset-management-network:
    driver: bridge
