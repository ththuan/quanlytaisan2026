worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json application/xml image/svg+xml font/woff font/woff2 application/x-font-ttf font/opentype;
    gzip_static on;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Trang 404 tĩnh (h5bp) cho tài nguyên không tồn tại.
        # Các route SPA vẫn fallback về index.html bên dưới.
        error_page 404 /404.html;
        location = /404.html {
            internal;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # File có hash trong tên → cache vĩnh viễn.
        # Dùng ^~ để prefix này thắng các location regex phía dưới.
        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Service worker & manifest: luôn lấy bản mới sau khi deploy
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            expires -1;
        }

        location = /push-sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            expires -1;
        }

        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            expires -1;
        }

        location = /robots.txt {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Icon/logo/ảnh tĩnh ở thư mục gốc (không nằm trong /assets/)
        location ~* ^/(?:logo-truong|icon-|apple-touch-icon|favicon).*\.(?:ico|png|jpe?g|svg|webp)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Font self-host (nếu có) → cache dài
        location ~* \.(?:woff2?|ttf|otf|eot)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
