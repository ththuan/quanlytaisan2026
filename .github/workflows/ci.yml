name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: asset-management-backend/package-lock.json
      - run: npm ci
        working-directory: asset-management-backend
      - run: npm run typecheck
        working-directory: asset-management-backend

  typecheck-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: asset-management-frontend/package-lock.json
      - run: npm ci
        working-directory: asset-management-frontend
      - run: npm run typecheck
        working-directory: asset-management-frontend
