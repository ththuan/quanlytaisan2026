events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 20m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/x-font-ttf font/opentype;
    gzip_min_length 1000;

    # Upstream keepalive pools - tái sử dụng TCP connections
    upstream backend_pool {
        server backend:5000;
        keepalive 32;
    }

    upstream frontend_pool {
        server frontend:80;
        keepalive 16;
    }

    # HTTP server - cho phép public scan page và API public không cần HTTPS
    # (tránh lỗi SSL self-signed cert trên điện thoại khi quét QR)
    server {
        listen 80;
        server_name _;

        # Trang tra cứu QR - backend phục vụ HTML trực tiếp (không cần Vue SPA, không cần auth)
        location /scan/ {
            proxy_pass         http://backend_pool/scan/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
        }

        # API public (tra cứu qua QR) - cho phép HTTP không redirect HTTPS
        location /api/public/ {
            proxy_pass         http://backend_pool/api/public/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # API Backend (đăng nhập, CRUD...) - phải có trên cả HTTP để login qua http://IP hoạt động
        location /api/ {
            proxy_pass         http://backend_pool/api/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            add_header         Cache-Control "private, no-store, max-age=0" always;
            add_header         Pragma "no-cache" always;
            add_header         Vary "Authorization" always;
        }

        # Storage (ảnh tài sản)
        location /storage/ {
            proxy_pass         http://backend_pool/storage/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
        }

        # Tất cả các đường dẫn khác → serve frontend (HTTP)
        location / {
            proxy_pass         http://frontend_pool/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Trang tra cứu QR - backend phục vụ HTML trực tiếp (không cần Vue SPA, không cần auth)
        location /scan/ {
            proxy_pass         http://backend_pool/scan/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
        }

        # API Backend
        location /api/ {
            proxy_pass         http://backend_pool/api/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            add_header         Cache-Control "private, no-store, max-age=0" always;
            add_header         Pragma "no-cache" always;
            add_header         Vary "Authorization" always;
        }

        # Static storage (images upload)
        location /storage/ {
            proxy_pass         http://backend_pool/storage/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
        }

        # Service Worker và Manifest - không cache, header đặc biệt
        location = /sw.js {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
            add_header         Service-Worker-Allowed "/";
            expires            -1;
        }

        location = /manifest.webmanifest {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
            expires            -1;
        }

        # Frontend - static assets có hash → cache vĩnh viễn
        # Dùng ^ để anchor đầu URI, tránh khớp nhầm /storage/assets/...
        location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=31536000, immutable";
            access_log         off;
        }

        # Frontend - index.html và các file không có hash → không cache
        location / {
            proxy_pass         http://frontend_pool/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
            # SPA fallback
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
