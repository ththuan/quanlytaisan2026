services:
  postgres:
    image: postgres:14-alpine
    container_name: asset-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-asset_management}
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=768MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asset-management-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asset-management-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - asset-management-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./asset-management-backend
      dockerfile: Dockerfile
      target: production
    container_name: asset-management-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-asset_management}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?DEFAULT_PASSWORD is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CHANGE_ME_STRONG_ADMIN_PASSWORD}
      QR_REQUIRE_SIGNATURE: ${QR_REQUIRE_SIGNATURE:-true}
      QR_ALLOW_LEGACY_NO_TOKEN: ${QR_ALLOW_LEGACY_NO_TOKEN:-false}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      PUBLIC_SCAN_RATE_LIMIT_WINDOW_MS: ${PUBLIC_SCAN_RATE_LIMIT_WINDOW_MS:-60000}
      PUBLIC_SCAN_RATE_LIMIT_MAX_REQUESTS: ${PUBLIC_SCAN_RATE_LIMIT_MAX_REQUESTS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_IDLE: ${DB_POOL_IDLE:-30000}
      DB_POOL_ACQUIRE: ${DB_POOL_ACQUIRE:-30000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Số worker cluster (PM2). Trống = toàn bộ CPU core. DB pool tổng = PM2_INSTANCES × DB_POOL_MAX.
      PM2_INSTANCES: ${PM2_INSTANCES:-}
      # Rate limiting (nâng tạm khi load-test từ 1 IP, vd =1000000)
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-500}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - asset-management-network
    volumes:
      - backend_backups:/app/backups
      - ./asset-management-backend/storage:/app/storage
      - ./asset-management-backend/logs:/app/logs
    command: sh -c "npm run migrate && npm run start"

  frontend:
    build:
      context: ./asset-management-frontend
      dockerfile: Dockerfile
      target: production
    container_name: asset-management-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - asset-management-network

  nginx:
    image: nginx:alpine
    container_name: asset-management-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - asset-management-network

  # Cloudflare Tunnel - public ra internet qua domain (vd: quanlytaisanctec.dpdns.org)
  # Khong can mo port tren router/firewall. Chi khoi dong khi chay voi --profile cloudflare
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: asset-management-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    environment:
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - asset-management-network
    profiles:
      - cloudflare

volumes:
  postgres_data:
    external: true
    name: quanlytaisan_postgres_data
  redis_data:
    external: true
    name: quanlytaisan_redis_data
  backend_backups:
    external: true
    name: quanlytaisan_backend_backups

networks:
  asset-management-network:
    driver: bridge
