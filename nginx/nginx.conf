events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 20m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/x-font-ttf font/opentype;
    gzip_min_length 1000;

    # Upstream keepalive pools - tái sử dụng TCP connections
    upstream backend_pool {
        server backend:5000;
        keepalive 32;
    }

    upstream frontend_pool {
        server frontend:80;
        keepalive 16;
    }

    # Chuyển hướng HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # API Backend
        location /api/ {
            proxy_pass         http://backend_pool/api/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Static storage (images upload)
        location /storage/ {
            proxy_pass         http://backend_pool/storage/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
        }

        # Frontend - static assets có hash → cache vĩnh viễn
        location ~* /assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=31536000, immutable";
            access_log         off;
        }

        # Frontend - index.html và các file không có hash → không cache
        location / {
            proxy_pass         http://frontend_pool/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            add_header         Cache-Control "no-cache, no-store, must-revalidate";
            # SPA fallback
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
