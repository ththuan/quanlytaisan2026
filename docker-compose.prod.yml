services:
  postgres:
    image: postgres:14-alpine
    container_name: asset-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-asset_management}
    # Tuned cho server 8 CPU / 8GB RAM.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=8MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_parallel_workers_per_gather=2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 512mb
    networks:
      - asset-management-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asset-management-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - asset-management-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./asset-management-backend
      dockerfile: Dockerfile
      target: production
    container_name: asset-management-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-asset_management}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?DEFAULT_PASSWORD is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CHANGE_ME_STRONG_ADMIN_PASSWORD}
      QR_REQUIRE_SIGNATURE: ${QR_REQUIRE_SIGNATURE:-true}
      QR_ALLOW_LEGACY_NO_TOKEN: ${QR_ALLOW_LEGACY_NO_TOKEN:-false}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      PUBLIC_SCAN_RATE_LIMIT_WINDOW_MS: ${PUBLIC_SCAN_RATE_LIMIT_WINDOW_MS:-60000}
      PUBLIC_SCAN_RATE_LIMIT_MAX_REQUESTS: ${PUBLIC_SCAN_RATE_LIMIT_MAX_REQUESTS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
      # Tổng connection = PM2_INSTANCES × DB_POOL_MAX (4 × 15 = 60 < max_connections 200).
      DB_POOL_MAX: ${DB_POOL_MAX:-15}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_IDLE: ${DB_POOL_IDLE:-30000}
      DB_POOL_ACQUIRE: ${DB_POOL_ACQUIRE:-30000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Số worker cluster (PM2). DB pool tổng = PM2_INSTANCES × DB_POOL_MAX.
      PM2_INSTANCES: ${PM2_INSTANCES:-4}
      # Rate limiting theo token người dùng (fallback IP nếu chưa đăng nhập).
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-1500}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - asset-management-network
    volumes:
      - backend_backups:/app/backups
      - ./asset-management-backend/storage:/app/storage
      - ./asset-management-backend/logs:/app/logs
    # Chạy PM2 cluster để dùng nhiều CPU core (Dockerfile CMD bị override trước đây).
    command: sh -c "npm run migrate && node ./node_modules/pm2/bin/pm2-runtime start ecosystem.config.js"
    stop_grace_period: 20s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./asset-management-frontend
      dockerfile: Dockerfile
      target: production
    container_name: asset-management-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - asset-management-network

  nginx:
    image: nginx:alpine
    container_name: asset-management-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - asset-management-network

  # Cloudflare Tunnel - public ra internet qua domain (vd: quanlytaisanctec.dpdns.org)
  # Khong can mo port tren router/firewall. Chi khoi dong khi chay voi --profile cloudflare
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: asset-management-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    environment:
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - asset-management-network
    profiles:
      - cloudflare

volumes:
  postgres_data:
    external: true
    name: quanlytaisan_postgres_data
  redis_data:
    external: true
    name: quanlytaisan_redis_data
  backend_backups:
    external: true
    name: quanlytaisan_backend_backups

networks:
  asset-management-network:
    driver: bridge
