<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <title>Không tìm thấy trang | Quản lý tài sản CTEC</title>
    <style>
      * {
        line-height: 1.2;
        margin: 0;
      }

      html {
        color: #888;
        display: table;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        height: 100%;
        text-align: center;
        width: 100%;
      }

      body {
        display: table-cell;
        vertical-align: middle;
        margin: 2em auto;
        padding: 0 16px;
      }

      h1 {
        color: #555;
        font-size: 2em;
        font-weight: 500;
        margin-bottom: 0.5em;
      }

      p {
        margin: 0 auto;
        max-width: 420px;
        line-height: 1.5;
      }

      a {
        color: #409eff;
      }

      @media only screen and (max-width: 280px) {
        body,
        p {
          width: 95%;
        }

        h1 {
          font-size: 1.5em;
          margin: 0 0 0.3em;
        }
      }
    </style>
  </head>
  <body>
    <h1>Không tìm thấy trang</h1>
    <p>Trang bạn đang tìm không tồn tại hoặc đã bị di chuyển. <a href="/">Quay về trang chủ</a>.</p>
  </body>
</html>
