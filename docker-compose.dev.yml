version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: asset-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-asset_management}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asset-management-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./asset-management-backend
      dockerfile: Dockerfile
      target: development
    container_name: asset-management-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-asset_management}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asset-management-network
    volumes:
      # Tùy chọn (dev, máy Linux): mount socket để màn Quản trị hệ thống gọi được "docker ps".
      # Docker Desktop Windows thường không cần hoặc dùng đường dẫn khác; bỏ comment nếu hiểu rủi ro bảo mật.
      # - /var/run/docker.sock:/var/run/docker.sock
      - ./asset-management-backend/src:/app/src
      - ./asset-management-backend/logs:/app/logs
      - ./asset-management-backend/storage:/app/storage
      - ./asset-management-backend/package.json:/app/package.json
      - ./asset-management-backend/package-lock.json:/app/package-lock.json
    # Không mount /app/node_modules (volume rỗng làm mất dependency → API không lên → unhealthy).
    command: sh -c "npm install && npm run migrate && exec npm run dev"
    healthcheck:
      # Dùng 127.0.0.1 — localhost có thể resolve ::1, server chỉ lắng nghe IPv4 → healthcheck fail.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\"" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

  # Frontend: KHÔNG mount volume /app/node_modules — volume rỗng từng che node_modules trong image
  # và gây lỗi "Failed to resolve sigma". Mỗi lần chạy: npm install (theo package.json đã mount) rồi vite.
  frontend:
    build:
      context: ./asset-management-frontend
      dockerfile: Dockerfile
      target: development
    container_name: asset-management-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - asset-management-network
    volumes:
      - ./asset-management-frontend/src:/app/src
      - ./asset-management-frontend/index.html:/app/index.html
      - ./asset-management-frontend/vite.config.ts:/app/vite.config.ts
      - ./asset-management-frontend/tsconfig.json:/app/tsconfig.json
      - ./asset-management-frontend/package.json:/app/package.json
      - ./asset-management-frontend/package-lock.json:/app/package-lock.json
    command: sh -c "npm install && exec npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
    external: true
    name: quanlytaisan_postgres_data

networks:
  asset-management-network:
    driver: bridge
